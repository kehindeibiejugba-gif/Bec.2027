  background-size: 32px 32px;

@keyframes fade {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes slide {
  from {
    transform: translateX(-16px);
    opacity: 0;
  }
  to {
    transform: none;
    opacity: 1;
  }
}
@keyframes slideR {
  from {
    transform: translateX(16px);
    opacity: 0;
  }
  to {
    transform: none;
    opacity: 1;
  }
}
@keyframes flash {
  from {
    background: rgba(106, 169, 255, 0.12);
  }
  to {
    background: transparent;
  }
}
@keyframes pulseSoft {
  0%, 100% {
    opacity: 1;
  }
  50% {
    opacity: 0.65;
  }
}
.anim-fade {
  animation: fade 0.16s ease-out;
}
.anim-rise {
  animation: rise 0.22s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.anim-slide {
  animation: slide 0.2s ease-out;
}
.anim-slide-r {
  animation: slideR 0.2s ease-out;
}
.anim-flash {
  animation: flash 1.6s ease-out;
}
.anim-pulse-soft {
  animation: pulseSoft 2.4s ease-in-out infinite;
}
main > div {
  animation: rise 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
